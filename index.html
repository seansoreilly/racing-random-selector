<body class="min-h-screen bg-gradient-to-br from-secondary-50 to-secondary-100 font-racing text-secondary-900 antialiased">
    <!-- Main Application Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">
        <!-- Header Section -->
        <header class="animate-fade-in">
          <div class="header-image-container">
            <img src="/public/sprites/header.png" alt="Racing Random Selector" class="w-full block" />
            <div class="header-url-overlay">
              www.racingrandomselector.top
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main class="animate-slide-up">
            <!-- Responsive Layout: Mobile-first, then Desktop 3-column -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8 mb-8">
                <!-- Input Section - Left Column -->
                <div class="lg:col-span-1 space-y-6">
                    <!-- Participants Panel -->
                    <div class="panel-racing">
                        <div class="bg-gradient-to-r from-secondary-50 to-white p-4 border-b border-secondary-200">
                            <h2 class="text-lg sm:text-xl font-bold text-secondary-800 flex items-center gap-3">
                                <span aria-hidden="true">👥</span>
                                <span>Participants</span>
                            </h2>
                        </div>
                        <div class="p-4">
                            <label for="nameInput" class="visually-hidden">Participant names, one per line</label>
                            <textarea id="nameInput" placeholder="Enter participant names (one per line)&#10;&#10;Example:&#10;Lightning McQueen&#10;Speed Racer&#10;Fast & Furious" class="racing-input min-h-[180px] sm:min-h-[200px] resize-none focus-racing"></textarea>
                            <div class="mt-3 flex flex-wrap gap-2">
                                <button id="loadDemo" class="btn-quiet text-xs px-3 py-1">
                                    ✨ Load demo
                                </button>
                                <button id="clearNames" class="btn-quiet text-xs px-3 py-1">
                                    Clear
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Race Settings Panel -->
                    <div class="panel-racing">
                        <div class="bg-gradient-to-r from-secondary-50 to-white p-4 border-b border-secondary-200">
                            <h2 class="text-lg sm:text-xl font-bold text-secondary-800 flex items-center gap-3">
                                <span aria-hidden="true">🎚️</span>
                                <span>Race Settings</span>
                            </h2>
                        </div>
                        <div class="p-4 space-y-4">
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <label for="speedControl" class="text-sm font-medium text-secondary-700">Race Speed:</label>
                                    <span id="speedValue" class="text-primary-600 font-bold text-lg px-3 py-1 bg-primary-50 rounded-full"></span>
                                </div>
                                <input type="range" id="speedControl" min="0" max="100" value="70" aria-describedby="speedValue"
                                       class="w-full h-3 bg-secondary-200 rounded-lg appearance-none cursor-pointer slider-thumb focus-racing">
                                <div class="flex justify-between text-xs text-secondary-500 font-medium">
                                    <span>🐢 Slower</span>
                                    <span>🚀 Faster</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Race Section - Right Column (spans 2 columns on large screens) -->
                <div class="lg:col-span-2">
                    <div class="panel-racing h-full flex flex-col">
                        <div class="bg-gradient-to-r from-secondary-50 to-white p-4 border-b border-secondary-200 flex-shrink-0">
                            <h2 class="text-lg sm:text-xl font-bold text-secondary-800 flex items-center gap-3">
                                <span aria-hidden="true">🏁</span>
                                <span>Race Track</span>
                                <div class="ml-auto flex items-center gap-2">
                                    <span id="raceChip" class="hidden sm:inline text-xs bg-secondary-100 text-secondary-600 px-2 py-1 rounded-full">
                                        Ready to race
                                    </span>
                                </div>
                            </h2>
                        </div>
                        <div class="p-4 flex-grow flex flex-col">
                            <div id="raceTrackContainer" class="race-track relative">
                                <div class="finish-line"></div>
                                <div id="raceLanes" class="space-y-2 p-4"></div>
                                <div id="countdownOverlay" class="absolute inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden backdrop-blur-sm">
                                    <div class="countdown-display"></div>
                                </div>
                            </div>
                            <div id="winner" class="mt-4 hidden winner-celebration">
                            </div>
                            <!-- Single live region for countdown / winner announcements -->
                            <div id="raceStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap justify-center items-center gap-4 mb-8">
                <button id="newRace" class="btn-quiet text-sm px-4 py-2">
                    New race
                </button>
                <button id="startRace" class="btn-racing text-lg sm:text-xl px-6 sm:px-8 py-3 sm:py-4">
                    🏁 Start race
                </button>
            </div>

            <!-- Results Section -->
            <div class="panel-racing animate-fade-in">
                <div class="bg-gradient-to-r from-secondary-50 to-white p-4 border-b border-secondary-200 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                    <h2 class="text-lg sm:text-xl font-bold text-secondary-800 flex items-center gap-3">
                        <span aria-hidden="true">🏆</span>
                        <span>Race History</span>
                    </h2>
                    <div class="flex gap-2">
                        <button id="clearHistory" class="btn-quiet text-xs px-3 py-1">
                            Clear
                        </button>
                    </div>
                </div>
                <div class="p-4">
                    <!-- Contents rendered from state by script.js (results list or a single empty state) -->
                    <div id="resultsContainer" class="space-y-3 max-h-64 overflow-y-auto custom-scrollbar"></div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center text-secondary-500 text-sm py-4 border-t border-secondary-200">
            <div class="space-y-2">
                <p>
                    ❤️ Made with passion for fair and fun selections
                </p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
